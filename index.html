<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff8f2 0%, #f7e4e6 100%);
            color: #49363e;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            height: calc(100dvh - 40px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 25px;
            flex-shrink: 0;
        }

        header {
            background: linear-gradient(135deg, #b85e70 0%, #95475d 100%);
            padding: 20px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            color: white;
            display: flex;
            align-items: center;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
            font-weight: 300;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 25px;
            flex: 1;
            min-height: 0;
        }

        .schedule-section {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #fffcf9;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
            align-self: start;
        }

        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #efdadd;
            flex-wrap: wrap;
            gap: 15px;
        }

        .week-header h2 {
            font-size: 1.8em;
            color: #783e53;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #b85e70 0%, #95475d 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(149, 71, 93, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(149, 71, 93, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        [hidden] {
            display: none !important;
        }

        .save-status {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: #fff0da;
            color: #694b1e;
            font-size: 0.9em;
            overflow-wrap: anywhere;
            max-height: 100px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .save-status[data-state="saved"] {
            background: #e8f0e5;
            color: #365439;
        }

        .save-status[data-state="error"] {
            background: #f9e1e4;
            color: #852d40;
        }

        .account-panel {
            background: #fffcf9;
            border-radius: 15px;
            padding: 14px 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            min-width: 0;
            overflow-wrap: anywhere;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .account-panel .schedule-note {
            margin: 0;
        }

        #auth-status:empty {
            display: none;
        }

        .account-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .account-actions button {
            padding: 8px 12px;
        }

        .account-actions .icon-button {
            width: 40px;
            height: 40px;
            padding: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-button svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #pending-events {
            max-height: 120px;
            overflow-y: auto;
            padding-left: 20px;
            margin-top: 8px;
        }

        .schedule-scroll {
            flex: 1;
            min-height: 0;
            overflow: auto;
            margin-top: 12px;
            overscroll-behavior: contain;
        }

        .schedule-scroll:focus-visible {
            outline: 2px solid #783e53;
            outline-offset: 4px;
        }

        .schedule-grid {
            position: relative;
        }

        .current-time-line {
            position: absolute;
            height: 2px;
            background: #b13d4c;
            z-index: 1;
            pointer-events: none;
        }

        .current-time-line span {
            position: absolute;
            right: calc(100% + 6px);
            top: 50%;
            transform: translateY(-50%);
            padding: 2px 4px;
            border-radius: 4px;
            background: #b13d4c;
            color: white;
            font-size: 0.75em;
            font-weight: 600;
            white-space: nowrap;
        }

        .schedule-note {
            color: #735e67;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .schedule-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
        }

        .schedule-table thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: linear-gradient(135deg, #f9e9e9 0%, #efd8de 100%);
            color: #783e53;
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #b85e70;
            overflow-wrap: anywhere;
        }

        .day-date {
            display: block;
            margin-top: 5px;
            font-size: 0.85em;
            font-weight: 400;
        }

        .schedule-table thead th.current-day {
            background: #95475d;
            color: white;
        }

        .schedule-table tbody tr {
            height: 48px;
        }

        .schedule-table td,
        .schedule-table tbody th {
            padding: 4px;
            border-bottom: 1px solid #efdadd;
            border-right: 1px solid #efdadd;
            vertical-align: top;
        }

        .schedule-table .time-column {
            width: 115px;
            left: 0;
            z-index: 3;
        }

        .schedule-table tbody th {
            position: sticky;
            left: 0;
            z-index: 1;
            background: #fff8f5;
            padding: 12px 6px;
            white-space: nowrap;
            text-align: left;
        }

        .schedule-table td:empty {
            background: #fff8f5;
        }

        .schedule-table td.current-day {
            background: #f9e9ee;
            border-left: 1px solid #d5a1b0;
            border-right-color: #d5a1b0;
        }

        .schedule-table td.time-slot {
            background: #fffcf9;
            border-left: 4px solid #b85e70;
            padding: 8px;
            border-radius: 6px;
            overflow-wrap: anywhere;
            transition: all 0.3s ease;
        }

        .schedule-table td.time-slot:hover {
            background: #fceef0;
            border-left-color: #95475d;
        }

        .schedule-table td.time-slot.event {
            border-left-color: #b85e70;
            background: #f7e2e8;
        }

        .schedule-table td.time-slot.task {
            border-left-color: #cb7059;
            background: #fce5dc;
        }

        .schedule-table td.time-slot.empty {
            border-left-color: #dfc5cc;
            background: #fff8f5;
        }

        .time-label {
            font-weight: 600;
            color: #783e53;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .slot-title {
            font-weight: 600;
            color: #49363e;
            margin-bottom: 3px;
        }

        .slot-description {
            font-size: 0.85em;
            color: #735e67;
        }

        .slot-time {
            display: block;
            font-size: 0.8em;
            color: #783e53;
            margin-bottom: 6px;
        }

        .slot-suggestion {
            font-size: 0.8em;
            color: #95475d;
            font-style: italic;
            margin-top: 5px;
        }

        .sidebar-panel {
            background: #fffcf9;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-tabs {
            display: flex;
            gap: 6px;
            padding: 5px;
            margin-bottom: 12px;
            border-radius: 10px;
            background: #f9e9e9;
        }

        .form-tabs button {
            flex: 1;
            padding: 10px 6px;
            background: transparent;
            color: #783e53;
            box-shadow: none;
            transform: none;
        }

        .form-tabs button[aria-selected="true"] {
            background: #95475d;
            color: white;
        }

        .form-tabs button:focus-visible {
            outline: 2px solid #783e53;
            outline-offset: 2px;
        }

        .form-group {
            margin-bottom: 10px;
            min-width: 0;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        #event-status:empty {
            display: none;
        }

        label {
            display: block;
            font-weight: 500;
            color: #783e53;
            margin-bottom: 4px;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="time"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            min-width: 0;
            padding: 8px;
            border: 2px solid #efdadd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #b85e70;
            background: #fceef0;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #b85e70;
        }

        .event-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .event-item {
            background: #fceef0;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #b85e70;
            font-size: 0.9em;
        }

        .event-item small {
            display: block;
            color: #735e67;
            margin-top: 3px;
        }

        .suggestion-box {
            background: linear-gradient(135deg, #fce5dc 0%, #f9e9e9 100%);
            border-left: 4px solid #cb7059;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .suggestion-box strong {
            color: #783e53;
        }

        .suggestion-box p {
            margin: 5px 0;
            color: #735e67;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .container {
                height: auto;
                gap: 16px;
            }

            header {
                padding: 16px;
            }

            .top-bar {
                grid-template-columns: minmax(0, 1fr) minmax(0, 145px);
                gap: 10px;
            }

            .account-panel {
                padding: 10px;
            }

            .account-panel .schedule-note {
                font-size: 0.8em;
            }

            .account-actions button {
                font-size: 0.8em;
                padding: 8px;
            }

            .content-wrapper {
                grid-template-columns: 1fr;
            }

            .schedule-section {
                height: calc(100dvh - 130px);
                padding: 15px;
            }

            .week-header {
                margin-bottom: 12px;
                padding-bottom: 10px;
                gap: 8px;
            }

            .week-header h2 {
                font-size: 1.25em;
            }

            .nav-buttons {
                gap: 6px;
            }

            .nav-buttons button {
                padding: 8px 10px;
                font-size: 0.85em;
            }

            .schedule-table {
                min-width: 640px;
            }

            h1 {
                font-size: clamp(1rem, 5vw, 1.8rem);
                line-height: 1.2;
            }

            .schedule-table td,
            .schedule-table th {
                padding: 10px 5px;
                font-size: 0.9em;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <header>
                <h1>📅 My Schedule Assistant</h1>
            </header>
            <section class="account-panel" aria-label="Account and saving">
                <p id="account-status" class="schedule-note">Checking sign-in...</p>
                <div class="account-actions">
                    <button id="sign-in" type="button" disabled>Sign in with Google</button>
                    <button id="sign-out" class="icon-button" type="button" aria-label="Sign out" title="Sign out" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 21H4V3h5M14 8l5 4-5 4M9 12h10"/></svg>
                    </button>
                    <button id="retry-sync" class="icon-button" type="button" aria-label="Refresh / Retry sync" title="Refresh / Retry sync" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg>
                    </button>
                    <button id="discard-pending" type="button" hidden>Discard unsynced additions</button>
                </div>
                <p id="auth-status" class="schedule-note" role="status"></p>
                <div id="pending-panel" class="schedule-note" hidden>
                    <p>These additions are backed up on this device, but are not yet saved to the cloud or shown in the calendar:</p>
                    <ul id="pending-events"></ul>
                </div>
            </section>
        </div>

        <div class="content-wrapper">
            <!-- Main Schedule Section -->
            <div class="schedule-section">
                <div class="week-header">
                    <h2>Current Week Schedule</h2>
                    <div class="nav-buttons">
                        <button>← Previous</button>
                        <button>Today</button>
                        <button>Next →</button>
                    </div>
                </div>

                <p id="save-status" class="save-status" role="status" data-state="pending">Connecting to sign-in service...</p>
                <div class="schedule-scroll" role="region" aria-label="Weekly schedule" tabindex="0">
                <div class="schedule-grid">
                <table class="schedule-table" aria-label="Sunday to Saturday schedule in half-hour slots">
                    <thead>
                        <tr>
                            <th scope="col" class="time-column">Start – End</th>
                            <th scope="col">Sunday</th>
                            <th scope="col">Monday</th>
                            <th scope="col">Tuesday</th>
                            <th scope="col">Wednesday</th>
                            <th scope="col">Thursday</th>
                            <th scope="col">Friday</th>
                            <th scope="col">Saturday</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body"></tbody>
                </table>
                <div id="current-time-line" class="current-time-line" role="img" aria-label="Current time" hidden><span></span></div>
                </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-panel">
                    <div class="form-tabs" role="tablist" aria-label="Add to schedule">
                        <button type="button" id="event-tab" role="tab" aria-selected="true" aria-controls="event-panel">Add Event</button>
                        <button type="button" id="task-tab" role="tab" aria-selected="false" aria-controls="task-panel" tabindex="-1">Add Task</button>
                    </div>
                <!-- Add Event Panel -->
                <form id="event-panel" role="tabpanel" aria-labelledby="event-tab">
                    <div class="form-group">
                        <label for="event-title">Event Title</label>
                        <input type="text" id="event-title" placeholder="e.g., Lecture" maxlength="200" required>
                    </div>
                    <div class="form-group">
                        <label for="event-date">Date</label>
                        <input type="date" id="event-date" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="event-time">Start Time</label>
                            <input type="time" id="event-time" required>
                        </div>
                        <div class="form-group">
                            <label for="event-end">End Time</label>
                            <input type="time" id="event-end" required>
                        </div>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="event-repeat">
                        <label for="event-repeat" style="margin: 0;">Repeat Weekly</label>
                    </div>
                    <button type="submit" style="width: 100%; margin-top: 10px;" disabled>Add Event</button>
                    <p id="event-status" class="schedule-note" role="status" style="margin-top: 12px;"></p>
                </form>

                <!-- Add Task Panel -->
                <div id="task-panel" role="tabpanel" aria-labelledby="task-tab" hidden>
                    <div class="form-group">
                        <label for="task-title">Task Title</label>
                        <input type="text" id="task-title" placeholder="e.g., Complete report">
                    </div>
                    <div class="form-group">
                        <label for="task-deadline">Deadline</label>
                        <input type="date" id="task-deadline">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-duration">Duration (hours)</label>
                            <input type="text" id="task-duration" placeholder="2">
                        </div>
                        <div class="form-group">
                            <label for="task-priority">Priority</label>
                            <select id="task-priority">
                                <option>Low</option>
                                <option selected>Medium</option>
                                <option>High</option>
                            </select>
                        </div>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="task-flexible">
                        <label for="task-flexible" style="margin: 0;">Flexible Time</label>
                    </div>
                    <button style="width: 100%; margin-top: 10px;">Add Task</button>
                </div>
                </div>

            </div>
        </div>

    </div>
    <script>
        const formTabs = [...document.querySelectorAll('.form-tabs [role="tab"]')];

        function activateTab(activeTab) {
            formTabs.forEach(tab => {
                const selected = tab === activeTab;
                tab.setAttribute('aria-selected', String(selected));
                tab.tabIndex = selected ? 0 : -1;
                document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected;
            });
        }

        formTabs.forEach((tab, index) => {
            tab.addEventListener('click', () => activateTab(tab));
            tab.addEventListener('keydown', event => {
                let nextIndex;
                if (event.key === 'ArrowRight') nextIndex = (index + 1) % formTabs.length;
                else if (event.key === 'ArrowLeft') nextIndex = (index - 1 + formTabs.length) % formTabs.length;
                else if (event.key === 'Home') nextIndex = 0;
                else if (event.key === 'End') nextIndex = formTabs.length - 1;
                else return;
                event.preventDefault();
                activateTab(formTabs[nextIndex]);
                formTabs[nextIndex].focus();
            });
        });

        const eventForm = document.getElementById('event-panel');
        const eventStatus = document.getElementById('event-status');
        const eventsKey = 'schedule-assistant-events-v1';
        let savedEvents = [];
        let pendingEvents = [];
        let currentUser = null;
        let cloud = null;
        let cloudAvailable = false;
        let busy = true;
        let storageError = false;
        let cloudLoaded = false;
        let session = 0;
        const saveStatus = document.getElementById('save-status');
        const authStatus = document.getElementById('auth-status');
        const submitEvent = eventForm.querySelector('button[type="submit"]');

        function setSaveStatus(state, message) {
            saveStatus.dataset.state = state;
            saveStatus.textContent = message;
        }

        function updateControls() {
            submitEvent.disabled = busy || storageError;
            document.getElementById('sign-in').hidden = Boolean(currentUser);
            document.getElementById('sign-in').disabled = busy || !cloudAvailable;
            document.getElementById('sign-out').hidden = !currentUser;
            document.getElementById('sign-out').disabled = busy;
            document.getElementById('retry-sync').hidden = !currentUser;
            document.getElementById('retry-sync').disabled = busy || storageError;
            document.getElementById('discard-pending').hidden = !pendingEvents.length;
            document.getElementById('discard-pending').disabled = busy || storageError;
            document.getElementById('pending-panel').hidden = !pendingEvents.length;
            document.getElementById('pending-events').replaceChildren(...pendingEvents.map(entry => {
                const item = document.createElement('li');
                item.textContent = `${entry.title} (${entry.date}, ${entry.start} - ${entry.end})`;
                return item;
            }));
        }

        function toMinutes(time) {
            const [hours, minutes] = time.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function formatTime(minutes) {
            return `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`;
        }

        function dateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function validEvent(event) {
            if (!event || typeof event.title !== 'string' || !event.title.trim()
                || typeof event.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(event.date)
                || typeof event.repeat !== 'boolean') return false;
            const date = new Date(`${event.date}T00:00:00`);
            const timePattern = /^(?:[01]\d|2[0-3]):[0-5]\d$/;
            return !Number.isNaN(date.getTime()) && dateKey(date) === event.date
                && typeof event.start === 'string' && timePattern.test(event.start)
                && typeof event.end === 'string' && timePattern.test(event.end)
                && toMinutes(event.end) > toMinutes(event.start);
        }

        function validateEvents(events, requireIds = false) {
            if (!Array.isArray(events) || events.length > 1000
                || !events.every(entry => validEvent(entry) && ((!requireIds && entry.id === undefined)
                    || (typeof entry.id === 'string' && entry.id.length > 0 && entry.id.length <= 100)))) {
                throw new Error('Saved events have an invalid format or exceed the 1,000-event limit.');
            }
            return events.map(entry => ({ ...entry, id: entry.id || crypto.randomUUID() }));
        }

        function guestEvents() {
            const stored = localStorage.getItem(eventsKey);
            return stored === null ? [] : validateEvents(JSON.parse(stored));
        }

        function backupEvents(events = savedEvents, pending = pendingEvents) {
            if (currentUser) {
                localStorage.setItem(`${eventsKey}:${currentUser.uid}`, JSON.stringify({ events, pending }));
            } else {
                localStorage.setItem(eventsKey, JSON.stringify(events));
            }
        }

        function loadGuest(message) {
            currentUser = null;
            pendingEvents = [];
            savedEvents = [];
            storageError = false;
            cloudLoaded = false;
            try {
                savedEvents = guestEvents();
                setSaveStatus('local', message || 'Browser only - not synced. Sign in to save to the cloud.');
            } catch (error) {
                console.error('Unable to load browser events:', error);
                storageError = true;
                setSaveStatus('error', 'Could not load browser events. Adding is disabled to protect your data. Check browser storage permissions and reload.');
            }
            document.getElementById('account-status').textContent = 'Not signed in.';
            busy = false;
            updateControls();
            renderSchedule();
        }

        const today = new Date();
        const weekStart = new Date(today.getFullYear(), today.getMonth(), today.getDate() - today.getDay());
        document.getElementById('event-date').value = dateKey(today);
        const dateFormatter = new Intl.DateTimeFormat('en-GB', {
            day: 'numeric', month: 'short', year: 'numeric'
        });
        document.querySelectorAll('.schedule-table thead th:not(.time-column)').forEach((header, day) => {
            const date = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + day);
            const dateLabel = document.createElement('time');
            dateLabel.className = 'day-date';
            dateLabel.dateTime = dateKey(date);
            dateLabel.textContent = dateFormatter.format(date);
            header.append(dateLabel);
        });

        function occursOn(event, date) {
            const key = dateKey(date);
            return event.date === key || (event.repeat && event.date <= key
                && new Date(`${event.date}T00:00:00`).getDay() === date.getDay());
        }

        function eventsConflict(first, second) {
            const sameDay = occursOn(first, new Date(`${second.date}T00:00:00`))
                || occursOn(second, new Date(`${first.date}T00:00:00`));
            return sameDay
                && Math.floor(toMinutes(first.start) / 30) < Math.ceil(toMinutes(second.end) / 30)
                && Math.ceil(toMinutes(first.end) / 30) > Math.floor(toMinutes(second.start) / 30);
        }

        function mergeEvents(existing, additions) {
            const merged = [...existing];
            for (const entry of additions) {
                if (merged.some(item => sameEvent(item, entry))) continue;
                if (merged.some(item => item.id === entry.id)) {
                    throw new Error('An event changed on another device. Your addition is not synced; discard it and enter it again.');
                }
                const conflict = merged.find(item => eventsConflict(item, entry));
                if (conflict) {
                    throw new Error(`"${entry.title}" shares a half-hour slot with "${conflict.title}". Your additions are not synced.`);
                }
                merged.push(entry);
            }
            if (merged.length > 1000) throw new Error('The schedule is limited to 1,000 events. Your additions are not synced.');
            return merged;
        }

        function sameEvent(first, second) {
            return ['title', 'date', 'start', 'end', 'repeat'].every(key => first[key] === second[key]);
        }

        const scheduleBody = document.getElementById('schedule-body');
        const scheduleGrid = document.querySelector('.schedule-grid');
        const currentTimeLine = document.getElementById('current-time-line');

        function updateCurrentTime() {
            const now = new Date();
            const currentDate = dateKey(now);
            let currentDay = -1;
            document.querySelectorAll('.schedule-table thead th:not(.time-column)').forEach((header, day) => {
                const date = header.querySelector('time');
                const isToday = date.dateTime === currentDate;
                header.classList.toggle('current-day', isToday);
                if (isToday) {
                    currentDay = day;
                    date.setAttribute('aria-current', 'date');
                } else {
                    date.removeAttribute('aria-current');
                }
            });
            scheduleBody.querySelectorAll('td').forEach(cell => {
                cell.classList.toggle('current-day', Number(cell.dataset.day) === currentDay);
            });
            currentTimeLine.hidden = currentDay === -1;
            if (currentTimeLine.hidden) return;

            const minutes = now.getHours() * 60 + now.getMinutes();
            const row = scheduleBody.rows[Math.floor(minutes / 30)];
            const rowBounds = row.getBoundingClientRect();
            const timeWidth = document.querySelector('.schedule-table .time-column').getBoundingClientRect().width;
            const tableWidth = document.querySelector('.schedule-table').getBoundingClientRect().width;
            const fraction = (minutes % 30 + now.getSeconds() / 60) / 30;
            currentTimeLine.style.top = `${rowBounds.top - scheduleGrid.getBoundingClientRect().top + rowBounds.height * fraction}px`;
            currentTimeLine.style.left = `${timeWidth}px`;
            currentTimeLine.style.width = `${tableWidth - timeWidth}px`;
            currentTimeLine.firstElementChild.textContent = formatTime(minutes);
            currentTimeLine.setAttribute('aria-label', `Current time: ${formatTime(minutes)}`);
        }

        function renderSchedule() {
            const scheduledItems = [];
            for (let day = 0; day < 7; day++) {
                const date = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + day);
                savedEvents.filter(event => occursOn(event, date)).forEach(event => {
                    scheduledItems.push({ ...event, day, type: 'event', description: event.repeat ? 'Repeats weekly' : '' });
                });
            }
            scheduleBody.replaceChildren();
            for (let start = 0; start < 1440; start += 30) {
                const row = document.createElement('tr');
                const label = document.createElement('th');
                label.scope = 'row';
                label.className = 'time-label';
                label.textContent = `${formatTime(start)} – ${formatTime(Math.min(start + 30, 1439))}`;
                row.append(label);

                for (let day = 0; day < 7; day++) {
                    const item = scheduledItems.find(entry =>
                        entry.day === day && toMinutes(entry.start) < start + 30 && toMinutes(entry.end) > start
                    );
                    // A spanning cell already occupies the following rows for this day.
                    if (item && toMinutes(item.start) < start) continue;

                    const cell = document.createElement('td');
                    cell.dataset.day = day;
                    if (item) {
                        cell.rowSpan = Math.ceil(toMinutes(item.end) / 30) - Math.floor(toMinutes(item.start) / 30);
                        cell.classList.add('time-slot', item.type);
                        const time = document.createElement('span');
                        time.className = 'slot-time';
                        time.textContent = `${item.start} – ${item.end}`;
                        const title = document.createElement('div');
                        title.className = 'slot-title';
                        title.textContent = item.title;
                        const description = document.createElement('div');
                        description.className = 'slot-description';
                        description.textContent = item.description;
                        cell.append(time, title, description);
                    }
                    row.append(cell);
                }
                scheduleBody.append(row);
            }
            updateCurrentTime();
        }
        renderSchedule();
        new ResizeObserver(updateCurrentTime).observe(document.querySelector('.schedule-table'));
        setInterval(updateCurrentTime, 30000);
        window.addEventListener('focus', updateCurrentTime);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) updateCurrentTime();
        });

        eventForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (busy || storageError) return;
            const entry = {
                id: crypto.randomUUID(),
                title: document.getElementById('event-title').value.trim(),
                date: document.getElementById('event-date').value,
                start: document.getElementById('event-time').value,
                end: document.getElementById('event-end').value,
                repeat: document.getElementById('event-repeat').checked
            };
            if (!validEvent(entry)) {
                eventStatus.textContent = 'Enter a title, a valid date, and an end time later than the start time on the same day.';
                return;
            }
            const conflict = [...savedEvents, ...pendingEvents].find(existing => eventsConflict(existing, entry));
            if (conflict) {
                eventStatus.textContent = `This event shares a half-hour slot with "${conflict.title}". Choose another time.`;
                return;
            }
            if (savedEvents.length + pendingEvents.length >= 1000) {
                eventStatus.textContent = 'The schedule is limited to 1,000 events. This event was not saved.';
                return;
            }
            eventStatus.textContent = '';
            if (currentUser) {
                const nextPending = [...pendingEvents, entry];
                try {
                    backupEvents(savedEvents, nextPending);
                } catch (error) {
                    console.error('Unable to back up event:', error);
                    setSaveStatus('error', 'Not saved. Browser backup failed; nothing was uploaded. Keep this form open and check browser storage.');
                    return;
                }
                pendingEvents = nextPending;
                updateControls();
                await syncPending();
                if (savedEvents.some(item => item.id === entry.id)) showAddedEvent(entry);
                return;
            }
            const nextEvents = [...savedEvents, entry];
            setSaveStatus('pending', 'Saving in this browser...');
            try {
                backupEvents(nextEvents);
            } catch (error) {
                console.error('Unable to save event:', error);
                setSaveStatus('error', 'Not saved. Check browser storage permissions or available space and try again. Your form has been kept.');
                return;
            }
            savedEvents = nextEvents;
            renderSchedule();
            setSaveStatus('local', 'Saved on this device only - not synced.');
            showAddedEvent(entry);
        });

        function showAddedEvent(entry) {
            const shown = [...document.querySelectorAll('.day-date')].some(label =>
                occursOn(entry, new Date(`${label.dateTime}T00:00:00`)));
            eventStatus.textContent = shown
                ? 'Event added.'
                : 'Event saved. Its date is outside the displayed week.';
            if (shown) focusTime(toMinutes(entry.start));
        }

        function cloudError(error) {
            const code = error.code || '';
            if (code.includes('resource-exhausted')) return 'Cloud usage limit reached. Retry after the quota resets.';
            if (code.includes('permission-denied')) return 'Cloud access denied. Check sign-in and database permissions.';
            if (code.includes('unavailable') || !navigator.onLine) return 'Cloud is unreachable. Check your connection and retry.';
            return error.message || 'An unexpected cloud error occurred. Please retry.';
        }

        async function syncPending() {
            if (!currentUser || busy || !pendingEvents.length) return;
            const uid = currentUser.uid;
            const revision = session;
            const additions = [...pendingEvents];
            busy = true;
            updateControls();
            setSaveStatus('pending', 'Saving to cloud... A backup is saved on this device.');
            const waiting = setTimeout(() => {
                if (session === revision) setSaveStatus('pending', 'Still waiting for cloud confirmation. Backed up on this device, but not confirmed saved to cloud. Keep this page open.');
            }, 15000);
            try {
                if (!navigator.onLine) throw new Error('You are offline.');
                const confirmed = await cloud.saveEvents(uid, existing => mergeEvents(validateEvents(existing, true), additions));
                if (session !== revision) return;
                savedEvents = confirmed;
                pendingEvents = [];
                cloudLoaded = true;
                renderSchedule();
                try {
                    backupEvents();
                    setSaveStatus('saved', 'Saved to cloud. Available when you sign in on another device.');
                } catch (error) {
                    console.error('Unable to update browser backup:', error);
                    setSaveStatus('local', 'Saved to cloud, but the browser backup could not be updated. Check browser storage.');
                }
            } catch (error) {
                console.error('Cloud save failed:', error);
                if (session === revision) setSaveStatus('error', `Saved on this device only - NOT synced. ${cloudError(error)} Use Retry sync, or discard the unsynced additions to edit them.`);
            } finally {
                clearTimeout(waiting);
                if (session === revision) {
                    busy = false;
                    updateControls();
                }
            }
        }

        async function refreshCloud() {
            if (!currentUser || busy || storageError) return;
            const uid = currentUser.uid;
            const revision = session;
            busy = true;
            updateControls();
            setSaveStatus('pending', 'Loading the latest cloud schedule...');
            try {
                const events = validateEvents(await cloud.loadEvents(uid), true);
                if (session !== revision) return;
                savedEvents = events;
                pendingEvents = pendingEvents.filter(entry => !events.some(item => sameEvent(item, entry)));
                cloudLoaded = true;
                renderSchedule();
                try {
                    backupEvents();
                    setSaveStatus(pendingEvents.length ? 'local' : 'saved', pendingEvents.length
                        ? 'Cloud schedule loaded. Some additions are saved on this device only - not synced. Use Retry sync.'
                        : 'Cloud schedule loaded. All displayed events are saved to cloud.');
                } catch (error) {
                    console.error('Unable to update browser backup:', error);
                    setSaveStatus('local', 'Cloud schedule loaded, but the browser backup could not be updated.');
                }
            } catch (error) {
                console.error('Cloud load failed:', error);
                if (session === revision) setSaveStatus('error', `${cloudError(error)} Showing this account's browser backup only; it may be out of date. Use Refresh / Retry sync.`);
            } finally {
                if (session === revision) {
                    busy = false;
                    updateControls();
                }
            }
        }

        async function accountChanged(user) {
            session++;
            scrollController?.abort();
            authStatus.textContent = '';
            eventStatus.textContent = '';
            eventForm.reset();
            document.getElementById('event-date').value = dateKey(new Date());
            if (!user) {
                loadGuest();
                return;
            }
            currentUser = user;
            savedEvents = [];
            pendingEvents = [];
            storageError = false;
            cloudLoaded = false;
            document.getElementById('account-status').textContent = `Signed in as ${user.email || user.displayName || 'Google user'}.`;
            try {
                const stored = localStorage.getItem(`${eventsKey}:${user.uid}`);
                if (stored !== null) {
                    const backup = JSON.parse(stored);
                    savedEvents = validateEvents(backup.events, true);
                    pendingEvents = validateEvents(backup.pending, true);
                }
            } catch (error) {
                console.error('Unable to load account backup:', error);
                storageError = true;
                setSaveStatus('error', 'Could not load this account\'s browser backup. Adding and syncing are disabled to protect unsynced data. Check browser storage and reload.');
            }
            busy = false;
            renderSchedule();
            updateControls();
            if (!storageError) await refreshCloud();
        }

        document.getElementById('sign-in').addEventListener('click', async () => {
            authStatus.textContent = 'Complete sign-in in the Google window.';
            try {
                await cloud.signIn();
                authStatus.textContent = 'Signed in with Google.';
            } catch (error) {
                console.error('Google sign-in failed:', error);
                authStatus.textContent = `Sign-in did not complete. ${error.code === 'auth/popup-blocked'
                    ? 'Allow pop-ups for this site and try again.'
                    : error.code === 'auth/popup-closed-by-user' ? 'The Google window was closed. You can try again.' : cloudError(error)}`;
            }
        });

        document.getElementById('sign-out').addEventListener('click', async () => {
            if (busy) return;
            authStatus.textContent = '';
            try {
                await cloud.signOut();
            } catch (error) {
                console.error('Sign-out failed:', error);
                authStatus.textContent = `Could not sign out. ${cloudError(error)}`;
            }
        });

        document.getElementById('retry-sync').addEventListener('click', () =>
            pendingEvents.length ? syncPending() : refreshCloud());

        document.getElementById('discard-pending').addEventListener('click', () => {
            if (busy || !confirm('Discard additions that have not been confirmed saved to cloud? Browser-only events and confirmed cloud events will not be deleted.')) return;
            try {
                backupEvents(savedEvents, []);
                pendingEvents = [];
                updateControls();
                setSaveStatus(cloudLoaded ? 'saved' : 'local', cloudLoaded
                    ? 'Unsynced additions discarded. Displayed events are saved to cloud.'
                    : 'Unsynced additions discarded. Showing a browser backup; refresh to confirm the cloud schedule.');
            } catch (error) {
                console.error('Unable to discard unsynced additions:', error);
                setSaveStatus('error', 'Could not update browser storage. Unsynced additions have been kept.');
            }
        });

        let scrollController;
        function focusTime(minutes) {
            scrollController?.abort();
            const scroll = document.querySelector('.schedule-scroll');
            const currentSlot = Math.floor(minutes / 30);
            const row = scheduleBody.rows[currentSlot];
            const headerHeight = document.querySelector('.schedule-table thead').getBoundingClientRect().height;
            const rowTop = row.getBoundingClientRect().top - scroll.getBoundingClientRect().top + scroll.scrollTop;
            const target = Math.max(0, Math.min(
                scroll.scrollHeight - scroll.clientHeight,
                rowTop - headerHeight - (scroll.clientHeight - headerHeight - row.getBoundingClientRect().height) / 2
            ));
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                scroll.scrollTo({ top: target, behavior: 'instant' });
                return;
            }

            const start = scroll.scrollTop;
            const duration = 1800;
            const startedAt = performance.now();
            const controller = new AbortController();
            scrollController = controller;
            let frame;
            // Let manual scrolling take over immediately.
            ['wheel', 'touchstart', 'pointerdown', 'keydown'].forEach(type => {
                scroll.addEventListener(type, () => controller.abort(), {
                    once: true, passive: true, signal: controller.signal
                });
            });
            controller.signal.addEventListener('abort', () => cancelAnimationFrame(frame), { once: true });

            function animate(now) {
                const progress = Math.min((now - startedAt) / duration, 1);
                const eased = progress < 0.5
                    ? 4 * progress ** 3
                    : 1 - (-2 * progress + 2) ** 3 / 2;
                scroll.scrollTo({ top: start + (target - start) * eased, behavior: 'instant' });
                if (progress < 1) frame = requestAnimationFrame(animate);
                else controller.abort();
            }

            frame = requestAnimationFrame(animate);
        }
        requestAnimationFrame(() => focusTime(today.getHours() * 60 + today.getMinutes()));

        async function initializeCloud() {
            try {
                const config = await import('./cloud-config.js');
                if (!config.cloudEnabled) {
                    loadGuest('Cloud features are disabled. Browser only - not synced.');
                    return;
                }
                const { createCloud } = await import('./cloud.js');
                cloud = createCloud();
                cloudAvailable = true;
                await cloud.start(accountChanged, error => {
                    console.error('Authentication state failed:', error);
                    session++;
                    cloudAvailable = false;
                    loadGuest('Sign-in service failed. Browser only - not synced.');
                    authStatus.textContent = cloudError(error);
                });
            } catch (error) {
                console.error('Cloud initialization failed:', error);
                cloudAvailable = false;
                loadGuest('Sign-in service unavailable. Browser only - not synced.');
                authStatus.textContent = 'Could not connect to Google sign-in. Check your connection and reload. Local events are still available.';
            }
        }
        initializeCloud();
    </script>
</body>
</html>
